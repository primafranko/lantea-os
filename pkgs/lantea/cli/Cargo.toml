[package]
name = "lantea"
description = "The lantea command: plain-language access to a Lantea OS system"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "lantea"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "process"] }
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[features]
# Lets the tests redirect the Record to their own socket with
# LANTEA_JOURNAL_SOCKET (decision 0017). Never enabled in the installed binary.
test-journal-socket = []
